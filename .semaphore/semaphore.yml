# Semaphore CI pipeline for Scharf.
version: v1.0
name: "Scharf CI"

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

fail_fast:
  stop:
    when: "branch != 'main'"

auto_cancel:
  running:
    when: "branch != 'main'"
  queued:
    when: "branch != 'main'"

global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version go 1.25
      - cache restore go-mod-$(checksum go.sum) || true
      - cache restore go-build-$SEMAPHORE_GIT_BRANCH || cache restore go-build-main || true
      - go env -w GOMODCACHE=$HOME/go/pkg/mod
      - go env -w GOCACHE=$HOME/.cache/go-build

blocks:
  - name: "Setup"
    dependencies: []
    task:
      jobs:
        - name: "Download Go modules"
          commands:
            - go mod download
            - cache store go-mod-$(checksum go.sum) $HOME/go/pkg/mod

  - name: "Quality"
    dependencies: ["Setup"]
    task:
      jobs:
        - name: "gofmt"
          commands:
            - test -z "$(gofmt -l .)"
        - name: "go vet"
          commands:
            - go vet ./...

  - name: "Test"
    dependencies: ["Setup"]
    task:
      jobs:
        - name: "Go tests"
          commands:
            - mkdir -p test-results
            - go install gotest.tools/gotestsum@latest
            - $(go env GOPATH)/bin/gotestsum --format pkgname --junitfile test-results/go-tests.xml -- ./...
      epilogue:
        always:
          commands:
            - test-results publish test-results/go-tests.xml
            - cache store go-build-$SEMAPHORE_GIT_BRANCH $HOME/.cache/go-build

  - name: "Security"
    dependencies: ["Setup"]
    task:
      jobs:
        - name: "govulncheck"
          commands:
            - go install golang.org/x/vuln/cmd/govulncheck@latest
            - govulncheck ./...
        - name: "Semgrep"
          commands:
            - python3 -m pip install --user --upgrade pip semgrep
            - export PATH="$HOME/.local/bin:$PATH"
            - semgrep scan

  - name: "Build"
    dependencies: ["Quality", "Test", "Security"]
    task:
      jobs:
        - name: "Build scharf"
          commands:
            - mkdir -p dist
            - CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/scharf .

after_pipeline:
  task:
    jobs:
      - name: "Publish test report"
        commands:
          - test-results gen-pipeline-report
